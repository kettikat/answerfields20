<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Response Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        .question-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        
        /* Label Header Styling */
        .header-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        h3 { margin: 0; color: #333; flex-grow: 1; }
        .label-input {
            flex-grow: 1;
            padding: 5px;
            font-size: 18px;
            font-weight: bold;
            display: none; /* Hidden until edit is clicked */
        }
        .icon-btn {
            background: none;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
        }
        .icon-btn:hover { background-color: #eee; }

        /* Answer Area Styling */
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
            resize: vertical;
        }
        .icon-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .main-btn {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn-submit { background-color: #28a745; color: white; }
        .btn-clear { background-color: #dc3545; color: white; }
        
        .submitted-answer {
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            min-height: 24px;
            font-style: italic;
            color: #555;
            white-space: pre-wrap;
        }
        .status { font-size: 12px; color: #888; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

    <h2>Class Responses</h2>
    
    <div id="fields-container"></div>

    <script>
        // REPLACE THIS URL WITH YOUR DEPLOYED APPS SCRIPT WEB APP URL
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby0GkYzHp3kXBwvEiQTPTx9f6-X8ptg6zw196zuWd02Y9mus_T6ExkYAuI_CORA3OmS/exec";
        const TOTAL_FIELDS = 20;

        // 1. GENERATE THE 20 HTML BLOCKS DYNAMICALLY
        const container = document.getElementById('fields-container');
        for (let i = 1; i <= TOTAL_FIELDS; i++) {
            const fieldId = 'q' + i;
            const defaultTitle = 'Answer ' + i;
            
            container.innerHTML += `
                <div class="question-container" id="block-${fieldId}">
                    
                    <div class="header-row">
                        <h3 id="label-display-${fieldId}">${defaultTitle}</h3>
                        <input type="text" id="label-input-${fieldId}" class="label-input" value="${defaultTitle}">
                        <button class="icon-btn" id="btn-edit-${fieldId}" onclick="startEditLabel('${fieldId}')">✏️ Edit</button>
                        <button class="icon-btn" id="btn-save-${fieldId}" onclick="saveLabel('${fieldId}')" style="display:none;">💾 Save</button>
                        <button class="icon-btn" onclick="clearLabel('${fieldId}')">🗑️ Reset Label</button>
                    </div>

                    <textarea id="input-${fieldId}" rows="4" placeholder="Type your answer here..."></textarea>
                    
                    <div class="icon-buttons">
                        <button class="main-btn btn-submit" onclick="submitAnswer('${fieldId}')">✅ Submit Answer</button>
                        <button class="main-btn btn-clear" onclick="clearAnswer('${fieldId}')">🗑️ Clear Answer</button>
                    </div>
                    
                    <span class="status">Currently submitted:</span>
                    <div class="submitted-answer" id="display-${fieldId}">Loading...</div>
                </div>
            `;
        }

        // 2. LOAD EXISTING DATA FROM SHEET
        async function loadExistingData() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                
                // Set default "loading" states to "no answer"
                for (let i = 1; i <= TOTAL_FIELDS; i++) {
                    document.getElementById('display-q' + i).innerText = "No answer submitted yet.";
                }

                // Populate with actual data from sheet
                for (const fieldId in data) {
                    if(document.getElementById('display-' + fieldId)) {
                        // Load Answer
                        if (data[fieldId].answer !== "") {
                            document.getElementById('display-' + fieldId).innerText = data[fieldId].answer;
                        }
                        // Load Label
                        if (data[fieldId].label !== "") {
                            document.getElementById('label-display-' + fieldId).innerText = data[fieldId].label;
                            document.getElementById('label-input-' + fieldId).value = data[fieldId].label;
                        }
                    }
                }
            } catch (error) {
                console.error("Error loading data", error);
            }
        }

        // 3. LABEL FUNCTIONS
        function startEditLabel(fieldId) {
            document.getElementById('label-display-' + fieldId).style.display = 'none';
            document.getElementById('label-input-' + fieldId).style.display = 'block';
            document.getElementById('btn-edit-' + fieldId).style.display = 'none';
            document.getElementById('btn-save-' + fieldId).style.display = 'inline-block';
        }

        function saveLabel(fieldId) {
            const newLabel = document.getElementById('label-input-' + fieldId).value;
            if(newLabel.trim() === "") return alert("Label cannot be empty.");

            // Update UI
            document.getElementById('label-display-' + fieldId).innerText = "Saving...";
            document.getElementById('label-input-' + fieldId).style.display = 'none';
            document.getElementById('label-display-' + fieldId).style.display = 'block';
            document.getElementById('btn-save-' + fieldId).style.display = 'none';
            document.getElementById('btn-edit-' + fieldId).style.display = 'inline-block';

            // Send to Sheet
            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'updateLabel', fieldId: fieldId, value: newLabel })
            }).then(() => { document.getElementById('label-display-' + fieldId).innerText = newLabel; });
        }

        function clearLabel(fieldId) {
            const defaultLabel = "Answer " + fieldId.replace('q', '');
            document.getElementById('label-display-' + fieldId).innerText = "Resetting...";
            
            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'clearLabel', fieldId: fieldId })
            }).then(() => {
                document.getElementById('label-display-' + fieldId).innerText = defaultLabel;
                document.getElementById('label-input-' + fieldId).value = defaultLabel;
            });
        }

        // 4. ANSWER FUNCTIONS
        function submitAnswer(fieldId) {
            const answerText = document.getElementById('input-' + fieldId).value;
            const displayElement = document.getElementById('display-' + fieldId);
            if (answerText.trim() === "") return alert("Please type an answer before submitting.");

            displayElement.innerText = "Saving to Google Sheets...";

            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'submitAnswer', fieldId: fieldId, value: answerText })
            }).then(() => {
                displayElement.innerText = answerText; 
                document.getElementById('input-' + fieldId).value = ''; 
            });
        }

        function clearAnswer(fieldId) {
            document.getElementById('input-' + fieldId).value = '';
            const displayElement = document.getElementById('display-' + fieldId);
            displayElement.innerText = "Clearing...";

            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'clearAnswer', fieldId: fieldId })
            }).then(() => { displayElement.innerText = "No answer submitted yet."; });
        }

        // Start loading sequence as soon as the page opens
        loadExistingData();
    </script>
</body>
</html>
